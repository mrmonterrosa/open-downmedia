services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-opendownmedia_admin_2026}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - backend_downloads:/app/temp_downloads
    networks:
      - open-downmedia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - open-downmedia-net
      - dokploy-network

networks:
  open-downmedia-net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  backend_downloads:
