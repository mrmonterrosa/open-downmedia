services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: open-downmedia-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=*
    volumes:
      - backend_downloads:/app/temp_downloads
    networks:
      - open-downmedia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: open-downmedia-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - open-downmedia-net

networks:
  open-downmedia-net:
    driver: bridge

volumes:
  backend_downloads:
